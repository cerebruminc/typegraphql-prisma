name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ["20.19.x", "22.12.x", "24.x"]

    services:
      db:
        image: postgres:14.4-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: typegraphql-prisma
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Setup project
        run: |
          npm ci

      - name: Check codebase
        run: |
          npm run check:format
          npm run check:type

      - name: Run tests
        run: |
          npm run test:ci
        env:
          CI: true
          PRISMA_HIDE_UPDATE_MESSAGE: "true"
          TEST_DATABASE_URL: postgresql://user:password@localhost:5432/typegraphql-prisma

  deploy-website:
    if: ${{ github.ref == 'refs/heads/main' && github.repository == 'cerebruminc/typegraphql-prisma' }}

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.x"

      - name: Build Docusaurus website
        run: |
          cd website
          npm ci
          npm run build

      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/build
          user_name: "gh-actions"
          user_email: "actions@github.com"
          commit_message: |
            Deploy website
            Deploy website version based on
